[tunnel]
tunnel_name = database_tunnel

# Cloud SSH server endpoint
server_host = your-cloud-server.example.com
server_port = 22

# Port exposed on the cloud server that remote clients will connect to
# Example: clients reach the DB on your-cloud-server.example.com:15432
port = 15432

# Keep-alive interval in seconds
keep_alive_time = 30

# Local database service to forward to
# Use 127.0.0.1 for a DB running on this same machine,
# or another LAN address if the DB is on a different host
remote_host = 127.0.0.1
remote_port = 5432          # PostgreSQL: 5432 | MySQL: 3306 | MSSQL: 1433

# SSH authentication — passwordless key required (no passphrase)
# Path is relative to this config file's directory
keyfile = keyfile_database
username = tunnel_user_db

# Cloud server's public host key for strict host verification
# Path is relative to this config file's directory
server_key = known_server_db

log_level = INFO
